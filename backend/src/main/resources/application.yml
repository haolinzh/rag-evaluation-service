server:
  port: 8080

spring:
  application:
    name: rag-evaluation-service
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/rag_eval
    username: ${DB_USER:rag}
    password: ${DB_PASSWORD:rag123}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

dashscope:
  api-key: ${DASHSCOPE_API_KEY}
  chat-model: qwen-plus
  embedding-model: text-embedding-v3
  rerank-model: qwen3-rerank

elasticsearch:
  host: ${ES_HOST:localhost}
  port: ${ES_PORT:9200}
  index-name: rag_chunks

redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}

retrieval:
  mode: hybrid
  top-k: 5
  recall-size-multiplier: 3
  rrf-k: 60
  rerank-candidates: 20
  similarity-threshold: 0.4

safety:
  min-similarity: 0.4
  enable-out-of-scope-check: true
  out-of-scope-threshold: 0.55
  forbidden-keywords: violence,hate,bomb,暴力,仇恨,炸弹,武器,银行卡,身份证,密码

pii:
  enabled: true
  patterns:
    - name: cn_id
      regex: "(\\d{6})(?:19|20)\\d{2}(?:0[1-9]|1[0-2])(?:0[1-9]|[12]\\d|3[01])(\\d{3}[\\dXx])"
      replacement: "$1********$2"
    - name: cn_phone
      regex: "(1[3-9]\\d)(\\d{4})(\\d{4})"
      replacement: "$1****$3"
    - name: email
      regex: "([\\w.%+-])[\\w.%+-]*(@[\\w.-]+\\.[A-Za-z]{2,})"
      replacement: "$1***$2"

cache:
  semantic:
    enabled: true
    ttl-seconds: 3600
    similarity-threshold: 0.92

logging:
  level:
    com.rag.eval: DEBUG
