server:
  port: 8080

spring:
  application:
    name: rag-evaluation-service
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/rag_eval
    username: ${DB_USER:rag}
    password: ${DB_PASSWORD:rag123}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

dashscope:
  api-key: ${DASHSCOPE_API_KEY}
  chat-model: qwen-plus
  embedding-model: text-embedding-v3

elasticsearch:
  host: ${ES_HOST:localhost}
  port: ${ES_PORT:9200}
  index-name: rag_chunks

redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}

retrieval:
  mode: hybrid
  top-k: 5
  recall-size-multiplier: 3
  rrf-k: 60
  similarity-threshold: 0.7

safety:
  min-similarity: 0.7
  enable-out-of-scope-check: false
  forbidden-keywords:
    - "violence"
    - "hate"
    - "bomb"

pii:
  enabled: true
  patterns:
    - name: cn_id
      regex: "\\d{6}(19|20)\\d{2}(0[1-9]|1[0-2])(0[1-9]|[12]\\d|3[01])\\d{3}[\\dXx]"
      replacement: "[ID_REDACTED]"
    - name: cn_phone
      regex: "1[3-9]\\d{9}"
      replacement: "[PHONE_REDACTED]"
    - name: email
      regex: "[\\w.%+-]+@[\\w.-]+\\.[A-Za-z]{2,}"
      replacement: "[EMAIL_REDACTED]"

cache:
  semantic:
    enabled: true
    ttl-seconds: 3600
    similarity-threshold: 0.92

logging:
  level:
    com.rag.eval: DEBUG
